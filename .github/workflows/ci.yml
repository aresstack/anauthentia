name: Verify AnAuthentia

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon clean build
      - name: Verify local Maven artifact generation
        run: ./gradlew --no-daemon publishToMavenLocal
