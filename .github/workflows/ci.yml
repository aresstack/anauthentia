name: Verify AnAuthentia

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The runtime the tests execute on. Gradle itself always runs on 21:
        # the Maven Central publishing plugins require a JVM 17+ build runtime,
        # so Java 8 cannot be the build JVM. Bytecode is produced for Java 8
        # either way via options.release = 8.
        test-java-version: ['8', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 8 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last entry wins for JAVA_HOME, so Gradle runs on 21.
          java-version: |
            8
            21
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test on Java ${{ matrix.test-java-version }}
        run: >-
          ./gradlew --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64
          -PtestJavaVersion=${{ matrix.test-java-version }}
          clean build
      - name: Verify local Maven artifact generation
        run: ./gradlew --no-daemon publishToMavenLocal
      - name: Verify release POMs
        run: ./gradlew --no-daemon -PreleaseVersion=0.0.0-ci verifyReleasePoms
